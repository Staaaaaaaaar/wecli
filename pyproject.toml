# Derived from wechat-cli; modified for wecli by Staaaaaaaaar, 2026.
# SPDX-License-Identifier: Apache-2.0
# Source and changes: docs/provenance.md

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecli"
dynamic = ["version"]
description = "A Linux command-line tool for local WeChat data"
classifiers = ["Operating System :: POSIX :: Linux"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "docs/provenance.md"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "pycryptodome>=3.19,<4",
    "zstandard>=0.22,<1",
]

[project.scripts]
wecli = "wecli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["wecli*"]

[project.urls]
Repository = "https://github.com/Staaaaaaaaar/wecli"

[tool.setuptools.dynamic]
version = {attr = "wecli.__version__"}

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.18", "build>=1.2,<2"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"wecli/main.py" = ["E402"]

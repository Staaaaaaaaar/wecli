# Derived from wechat-cli; modified for wecli by Staaaaaaaaar, 2026.
# SPDX-License-Identifier: Apache-2.0
# Source and changes: docs/provenance.md

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecli"
version = "0.1.0"
description = "A Linux command-line tool for local WeChat data"
classifiers = ["Operating System :: POSIX :: Linux"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "docs/provenance.md"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "pycryptodome>=3.19,<4",
    "zstandard>=0.22,<1",
]

[project.scripts]
wecli = "wecli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["wecli*"]

[project.urls]
Repository = "https://github.com/Staaaaaaaaar/wecli"
